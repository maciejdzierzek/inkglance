# Tests on every push; the menu-bar app is built for macOS and Windows.
# Releases (tags v*) attach the app bundles - signing and the updater key are
# configured in repository secrets (see docs/releasing.md).
name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test

  tray:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        working-directory: tray
        run: |
          npm install --no-audit --no-fund
          npx tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: inkglance-${{ matrix.os }}
          path: |
            tray/src-tauri/target/release/bundle/dmg/*.dmg
            tray/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
