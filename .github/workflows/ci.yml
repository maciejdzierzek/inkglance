# Tests on every push; the menu-bar app is built for macOS and Windows.
# Releases (tags v*) attach the app bundles - signing and the updater key are
# configured in repository secrets (see docs/releasing.md).
name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the secret scan
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Lint (ESLint, Knip)
        run: npm run lint
      - name: Shell scripts (ShellCheck)
        run: npm run lint:sh
      - name: Private data guard
        run: sh scripts/guard-private-data.sh --tracked
      - name: Secrets (gitleaks, whole history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner

  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test

  tray:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust format and lint
        working-directory: tray/src-tauri
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
      - name: Third-party notices (bundled with the app)
        run: node scripts/third-party-notices.js
      - name: Build
        working-directory: tray
        run: |
          npm install --no-audit --no-fund
          npx tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: inkglance-${{ matrix.os }}
          path: |
            tray/src-tauri/THIRD-PARTY-NOTICES.txt
            tray/src-tauri/target/release/bundle/dmg/*.dmg
            tray/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
