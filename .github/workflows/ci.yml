# Checks and tests on every push; the menu-bar app is built for macOS and
# Windows. A tag v* also publishes a GitHub release with the app bundles, the
# third-party notices and the notes from CHANGELOG.md (see docs/releasing.md).
name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the secret scan
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Lint (ESLint, Knip)
        run: npm run lint
      - name: Shell scripts (ShellCheck)
        run: npm run lint:sh
      - name: Private data guard
        run: sh scripts/guard-private-data.sh --tracked
      - name: Secrets (gitleaks, whole history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner

  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test

  tray:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Before clippy too: the Tauri build script checks that bundled resources exist.
      - name: Third-party notices (bundled with the app)
        run: node scripts/third-party-notices.js
      - name: Rust format and lint
        working-directory: tray/src-tauri
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
      - name: Build
        working-directory: tray
        run: |
          npm install --no-audit --no-fund
          npx tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: inkglance-${{ matrix.os }}
          path: |
            tray/src-tauri/THIRD-PARTY-NOTICES.txt
            tray/src-tauri/target/release/bundle/dmg/*.dmg
            tray/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: tray
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" 'index($0, "## " v " ") == 1 {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG section for $v"; exit 1; }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(find dist -type f \( -name '*.dmg' -o -name '*.exe' -o -name 'THIRD-PARTY-NOTICES.txt' \) | sort -u)
          echo "$files"
          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" --title "InkGlance $GITHUB_REF_NAME" --notes-file notes.md $files
